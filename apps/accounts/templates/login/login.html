<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueva API-login</title>
    <!-- Axios -->
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
  </head>
  <body>
    <div class="container">
      <form method="post">
        {% csrf_token %}
          <div class="card">
            <h1>Iniciar Sesión</h1>
            <h4>Ingresa tu usuario y contraseña</h4>
            <label for="" >Usuario:</label>
            <input type="text" placeholder="Usuario" name="username" id="username" required />
            <label for="">Contraseña:</label>
            <input type="password" placeholder="Contraseña" name="password" id="password" required />
            <button id="boton" type="submit">Ingresar</button>
            <div class="b-login">
              <a href="">Olvidé mi contraseña</a>          
            </div>
            
          </div>
        </div>

      </form>
      

    <script>
       // Verificar si hay un mensaje de error y mostrar la alerta si existe
      window.addEventListener('DOMContentLoaded', (event) => {
        const errorMessage = "{{ error_message }}";
        const access_denied = "{{ access_denied }}";
        if (errorMessage) {
            Swal.fire({
                icon: 'error',
                title: '¡Ups!, Error con las Credenciales',
                text: errorMessage,
                confirmButtonColor: '#0d6efd'
            });
        }

        if (access_denied) {
            Swal.fire({
                icon: 'error',
                title: '¡Acceso Denegado!',
                text: access_denied,
                confirmButtonColor: '#0d6efd'
            });
        }
      });
    </script> 
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
