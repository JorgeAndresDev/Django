{% extends "products/base.html" %}

{% load static %}

{% block page_title %}
Agregar productos
{% endblock %}

{% block title %}
Agregar productos
{% endblock %}

{% block header %}
<a class="text-decoration-none text-dark" href="{% url 'products:product_list' %}"><span class="ms-2">productos/</span></a>
<span class="ms-2">Agregar productos</span>
{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between p-3 bg-dark text-white">
        <div class="card-title">Agregar productos</div>
    </div>
    <div class="card-body" style="height: 600px; overflow-y: auto;">
        <div class="card-body text-center">
            <!-- Formulario -->
            <form id="productForm">
              <!-- Campo: Nombre -->
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Producto</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ingresa el nombre del producto" required>
              </div>

              <!-- Campo: Cantidad -->
              <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="cantidad" placeholder="Ingresa la cantidad" required>
              </div>

              <!-- Campo: Precio -->
              <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" id="precio" placeholder="Ingresa el precio" required>
              </div>

                <button type="submit" class="btn btn-success btn-lm">Guardar Producto</button>
            </form>
    </div>

    <div class="card-footer p-4"></div>
</div>

{% endblock %}
